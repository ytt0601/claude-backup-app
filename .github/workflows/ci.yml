name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build (windows-latest)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # SDK 10 系でビルドする(ソリューションが .slnx 形式のため。.slnx は SDK 8 では扱えない)。
      # 8.0.x も併せて入れているのは、フレームワーク依存で動くテストプロジェクト(net8.0-windows)を
      # 本来のターゲットと同じランタイムで実行するため。テスト側の RollForward=LatestMajor により
      # 10 系だけでも起動はできるが、CI では配布対象と同じ 8.0 で検証する。
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore
        working-directory: ClaudeBackupApp
        run: dotnet restore ClaudeBackupApp.slnx

      - name: Build
        working-directory: ClaudeBackupApp
        run: dotnet build ClaudeBackupApp.slnx -c Release --no-restore -warnaserror

      - name: Test
        working-directory: ClaudeBackupApp
        run: dotnet test ClaudeBackupApp.slnx -c Release --no-build --verbosity normal

      # 単一 exe の発行まで通ることを PR 時点で確認する
      # (self-contained + single-file はビルドが通っても発行で失敗しうるため)
      - name: Verify publish
        working-directory: ClaudeBackupApp
        run: dotnet publish src/ClaudeBackupApp -c Release --no-restore
