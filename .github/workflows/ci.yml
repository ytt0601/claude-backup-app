name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # 毎週月曜 02:30 UTC (= 月曜 11:30 JST)。CodeQL(03:00 UTC)より先に流し、
    # ビルドが壊れている場合に解析結果より先に気づけるようにしている。
    #
    # コードを変更していなくても定期的にビルドする理由:
    # windows-latest イメージの更新や、setup-dotnet が解決する 8.0.x / 10.0.x の
    # パッチ更新によって、こちら側が何もしていなくてもビルドや発行が壊れることがある。
    # 他プロジェクトと並行して長期間コミットが無い期間があるため、その間の破損を
    # 次にリリースしようとした時ではなく、起きた週に検知する。
    #
    # 注意: スケジュール実行はリポジトリが 60 日間非アクティブ(コミットが無い状態)になると
    # GitHub により自動で停止される。停止時はオーナーへ通知が届き、Actions 画面から再開できる。
    - cron: '30 2 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build (windows-latest)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # SDK 10 系でビルドする(ソリューションが .slnx 形式のため。.slnx は SDK 8 では扱えない)。
      # 8.0.x も併せて入れているのは、フレームワーク依存で動くテストプロジェクト(net8.0-windows)を
      # 本来のターゲットと同じランタイムで実行するため。テスト側の RollForward=LatestMajor により
      # 10 系だけでも起動はできるが、CI では配布対象と同じ 8.0 で検証する。
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore
        working-directory: ClaudeBackupApp
        run: dotnet restore ClaudeBackupApp.slnx

      - name: Build
        working-directory: ClaudeBackupApp
        run: dotnet build ClaudeBackupApp.slnx -c Release --no-restore -warnaserror

      - name: Test
        working-directory: ClaudeBackupApp
        run: dotnet test ClaudeBackupApp.slnx -c Release --no-build --verbosity normal

      # 単一 exe の発行まで通ることを PR 時点で確認する
      # (self-contained + single-file はビルドが通っても発行で失敗しうるため)
      - name: Verify publish
        working-directory: ClaudeBackupApp
        run: dotnet publish src/ClaudeBackupApp -c Release --no-restore
